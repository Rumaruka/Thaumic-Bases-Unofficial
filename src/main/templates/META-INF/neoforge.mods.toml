modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Thaumic Bases - updated for NeoForge ${minecraft_version}.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Thaumaturge dependency (API/modid may need adjustment for the target build)
[[dependencies.${mod_id}]]
    modId="thaumaturge"
    type="optional"
    versionRange="[1,)"
    ordering="AFTER"
    side="BOTH"

# JEI integration is optional; the mod loads without it.
[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="[19,)"
    ordering="AFTER"
    side="BOTH"
